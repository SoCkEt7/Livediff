name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create artifacts directory
        run: mkdir artifacts

      - name: Create GitHub release
        id: release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: build-release
    needs: ['create-release']
    runs-on: ${{ matrix.os }}
    env:
      CARGO: cargo
      TARGET_DIR: ./target
      TARGET_FLAGS: ""
    strategy:
      matrix:
        build: [linux, macos, macos-arm, windows]
        include:
          - build: linux
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
          - build: macos-arm
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
          - build: windows
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          staging="livediff-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/livediff.exe" "$staging/"
            7z a "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/livediff" "$staging/"
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "${{ env.ASSET }}" --clobber

  publish-crates:
    name: Publish to Crates.io
    needs: ['build-release']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: |
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | cut -d'"' -f2)
          if cargo search livediff | grep -q "^livediff .*${CURRENT_VERSION}"; then
            echo "Crate livediff@${CURRENT_VERSION} already exists, skipping publish."
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew Formula
    needs: ['build-release']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v7
        with:
          repository: 'SoCkEt7/homebrew-tap'
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Calculate Checksums and Update Formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Updating Formula/livediff.rb for version ${VERSION}..."

          # Download release tarballs
          gh release download "${TAG}" --repo SoCkEt7/Livediff -p "*.tar.gz" -D dist/

          ARM_SHA=$(sha256sum "dist/livediff-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          INTEL_SHA=$(sha256sum "dist/livediff-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          LINUX_SHA=$(sha256sum "dist/livediff-${TAG}-x86_64-unknown-linux-musl.tar.gz" | awk '{print $1}')

          cat << EOF > homebrew-tap/Formula/livediff.rb
          class Livediff < Formula
            desc "Watch file diffs live in your terminal. Minimalist Rust TUI companion to git diff"
            homepage "https://socket7.github.io/Livediff/"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/SoCkEt7/Livediff/releases/download/${TAG}/livediff-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              else
                url "https://github.com/SoCkEt7/Livediff/releases/download/${TAG}/livediff-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${INTEL_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/SoCkEt7/Livediff/releases/download/${TAG}/livediff-${TAG}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_SHA}"
              end
            end

            def install
              bin.install "livediff"
            end

            test do
              system "#{bin}/livediff", "--version"
            end
          end
          EOF

          cd homebrew-tap
          # Strip leading indentation from heredoc
          sed -i 's/^          //' Formula/livediff.rb

          git config user.name "SoCkEt7-bot"
          git config user.email "antonin.niv@gmail.com"
          git add Formula/livediff.rb

          if git diff --staged --quiet; then
            echo "No changes to Formula/livediff.rb"
          else
            git commit -m "feat(formula): update livediff to ${TAG}"
            git push origin main
            echo "Homebrew tap updated successfully!"
          fi
